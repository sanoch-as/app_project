name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pmp
          POSTGRES_PASSWORD: pmp
          POSTGRES_DB: pmp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmp -d pmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pmp:pmp@localhost:5432/pmp_test
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      CRON_SECRET: ci-cron-secret
      FRONTEND_ORIGIN: http://localhost:5173
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check (mypy)
        run: mypy src/app/services src/app/models
      - name: Run migrations
        run: alembic upgrade head
      - name: Tests with coverage
        run: pytest --cov=src/app/services --cov-report=term-missing --cov-fail-under=80 tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
