# Local development only. Production runs on Vercel Functions + Neon (see docs/architecture.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: pmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp
      POSTGRES_DB: pmp_dev
    ports:
      - "5432:5432"
    volumes:
      - pmp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmp_postgres_data:
